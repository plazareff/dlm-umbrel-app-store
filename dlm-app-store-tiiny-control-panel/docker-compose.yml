services:
  app_proxy:
    environment:
      APP_HOST: dlm-app-store-tiiny-control-panel_server_1
      APP_PORT: 8765

  server:
    image: ghcr.io/0xstian/tiiny-control-panel:1.5.0@sha256:ffe140966cf57d98aca619f6e82df83502c4e2b06586d600eed723ff7e3c7ef3
    restart: on-failure
    init: true
    environment:
      TIINY_UI_PORT: "8765"
      TIINY_UI_GATEWAY_PORT: "8766"
      TIINY_UI_TLS: "off"
    volumes:
      - ${APP_DATA_DIR}/data:/data
