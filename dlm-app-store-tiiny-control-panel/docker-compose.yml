services:
  app_proxy:
    environment:
      APP_HOST: dlm-app-store-tiiny-control-panel_server_1
      APP_PORT: 8765

  server:
    image: ghcr.io/0xstian/tiiny-control-panel:1.4.3@sha256:bf6eaa67831844dfa6233234ae6f7afcfb88d464ef7c5c07e7fd0e4ddb925049
    restart: on-failure
    init: true
    environment:
      TIINY_UI_PORT: "8765"
      TIINY_UI_GATEWAY_PORT: "8766"
      TIINY_UI_TLS: "off"
    volumes:
      - ${APP_DATA_DIR}/data:/data
